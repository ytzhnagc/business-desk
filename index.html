<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f3">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.github.com https://gist.githubusercontent.com; base-uri 'none'; object-src 'none'">
  <title>日常经营台 · 营收与成本</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17231d;
      --muted: #78827b;
      --line: #e4e9e3;
      --paper: #fff;
      --canvas: #f5f7f3;
      --green: #2e694d;
      --green-dark: #204e39;
      --green-soft: #eaf3ed;
      --lime: #d6ef70;
      --coral: #e8755b;
      --coral-soft: #fff0ec;
      --amber: #ebbd58;
      --shadow: 0 12px 32px rgba(24, 45, 32, .06);
      font-family: "Aptos", "Segoe UI", sans-serif;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--canvas); color: var(--ink); min-width: 320px; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .app { display: grid; grid-template-columns: 238px minmax(0, 1fr); min-height: 100vh; }
    .sidebar { background: var(--green-dark); color: #f4f8f3; padding: 27px 18px; display: flex; flex-direction: column; }
    .brand { display: flex; align-items: center; gap: 11px; padding: 0 10px 34px; }
    .brand-mark { width: 35px; height: 35px; display: grid; place-items: center; border-radius: 11px 11px 11px 3px; background: var(--lime); color: var(--green-dark); font: 700 20px Georgia, serif; }
    .brand-name { font: 700 17px Georgia, serif; letter-spacing: .1px; }
    .brand-sub { display: block; color: #a9c5b4; font: 11px "Aptos", "Segoe UI", sans-serif; margin-top: 3px; }
    .nav-label { color: #91b19c; text-transform: uppercase; letter-spacing: 1.2px; font-size: 10px; padding: 0 12px; margin: 7px 0 10px; }
    .nav-item { width: 100%; border: 0; background: transparent; color: #c9d9cf; text-align: left; padding: 12px; border-radius: 8px; margin: 2px 0; display: flex; align-items: center; gap: 12px; font-size: 13px; }
    .nav-item:hover, .nav-item.active { background: rgba(255,255,255,.11); color: #fff; }
    .nav-glyph { width: 22px; text-align: center; font-size: 16px; }
    .side-bottom { margin-top: auto; border-top: 1px solid rgba(255,255,255,.14); padding: 14px 9px 0; color: #a9c5b4; font-size: 11px; line-height: 1.7; }
    .side-sync { display: flex; align-items: center; gap: 7px; width: 100%; background: transparent; border: 0; color: #e2ede6; font-size: 11px; padding: 3px 0 6px; text-align: left; }
    .side-sync .sync-dot { background: #7e9a87; }
    .side-sync .sync-dot.ok { background: var(--lime); }
    .side-sync .sync-dot.busy { background: var(--amber); }
    .side-sync .sync-dot.err { background: var(--coral); }
    .side-note { color: #91b19c; font-size: 10px; line-height: 1.6; }
    .main { min-width: 0; padding: 30px clamp(18px, 4vw, 56px) 48px; max-width: 1600px; width: 100%; margin: 0 auto; }
    .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 27px; }
    .eyebrow { color: var(--green); font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
    h1 { margin: 0; font: 500 clamp(26px, 3vw, 34px)/1.15 Georgia, "Songti SC", serif; letter-spacing: 0; }
    .subtitle { margin: 9px 0 0; color: var(--muted); font-size: 13px; }
    .sync-chip { margin-top: 13px; display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: #fff; color: #5d6b61; border-radius: 999px; padding: 6px 11px; font-size: 11px; transition: .18s ease; }
    .sync-chip:hover { border-color: #b7c9bc; color: var(--green-dark); }
    .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: #a7b0a9; flex: none; transition: background .2s ease; }
    .sync-dot.ok { background: #2e694d; }
    .sync-dot.busy { background: #d9a740; animation: syncPulse 1.1s ease-in-out infinite; }
    .sync-dot.err { background: #bd5747; }
    @keyframes syncPulse { 50% { opacity: .3; } }
    .top-actions { display: flex; gap: 9px; align-items: center; }
    .button { border: 1px solid var(--line); background: #fff; color: var(--ink); padding: 10px 14px; border-radius: 7px; font-size: 12px; font-weight: 650; transition: .18s ease; }
    .button:hover { border-color: #b7c9bc; transform: translateY(-1px); }
    .button:disabled { opacity: .6; cursor: wait; transform: none; }
    .button.primary { background: var(--green); color: white; border-color: var(--green); }
    .button.primary:hover { background: var(--green-dark); }
    .button.danger { color: #af4737; }
    .button.small { padding: 7px 10px; font-size: 11px; }
    .period-row { display: flex; align-items: center; flex-wrap: wrap; gap: 13px; padding: 14px 0 19px; border-top: 1px solid var(--line); }
    .segmented { display: inline-flex; gap: 3px; background: #e9ede8; padding: 3px; border-radius: 8px; }
    .segment { border: 0; background: transparent; color: #727d74; border-radius: 6px; padding: 8px 14px; font-size: 12px; }
    .segment.active { background: #fff; color: var(--green-dark); box-shadow: 0 1px 3px rgba(15,35,22,.1); font-weight: 700; }
    .date-control { display: flex; gap: 7px; align-items: center; margin-left: auto; }
    .date-control input { width: 145px; border: 1px solid var(--line); background: #fff; border-radius: 7px; padding: 8px 9px; color: var(--ink); font-size: 12px; }
    .date-step { border: 1px solid var(--line); background: white; width: 32px; height: 32px; border-radius: 7px; color: #52635a; font-size: 17px; }
    .period-caption { color: var(--muted); font-size: 11px; white-space: nowrap; }
    .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 13px; margin-bottom: 17px; }
    .stat { border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 17px 18px 16px; min-height: 115px; position: relative; overflow: hidden; }
    .stat::after { content: ""; position: absolute; width: 64px; height: 64px; right: -24px; top: -25px; border-radius: 50%; background: var(--wash, var(--green-soft)); }
    .stat-label { color: var(--muted); font-size: 11px; display: flex; align-items: center; gap: 7px; }
    .stat-dot { width: 7px; height: 7px; background: var(--dot, var(--green)); border-radius: 50%; }
    .stat-value { margin-top: 16px; font: 600 24px/1 Georgia, "Aptos", sans-serif; letter-spacing: 0; font-variant-numeric: tabular-nums; }
    .stat-note { color: var(--muted); font-size: 10px; margin-top: 8px; }
    .stat.revenue { --dot: var(--green); --wash: var(--green-soft); }
    .stat.cost { --dot: var(--coral); --wash: var(--coral-soft); }
    .stat.profit { --dot: #b68b2a; --wash: #fff5dc; }
    .stat.margin { --dot: #6a8ab1; --wash: #edf3fa; }
    .panel { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }
    .chart-panel { padding: 19px 21px 17px; margin-bottom: 17px; }
    .panel-heading { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 18px; }
    .panel-title { margin: 0; font: 600 16px Georgia, "Songti SC", serif; }
    .legend { display: flex; align-items: center; gap: 15px; color: var(--muted); font-size: 10px; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend i { width: 8px; height: 8px; border-radius: 2px; background: var(--green); }
    .legend .cost-key { background: var(--coral); }
    .chart { height: 170px; display: flex; align-items: stretch; gap: 6px; padding: 5px 2px 0; overflow-x: auto; }
    .chart-group { flex: 1 0 35px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; min-width: 28px; }
    .bar-pair { height: 136px; display: flex; align-items: flex-end; gap: 3px; width: 100%; justify-content: center; border-bottom: 1px solid #e8ece8; }
    .bar { width: min(13px, 34%); min-height: 2px; border-radius: 3px 3px 0 0; background: var(--green); transition: height .25s ease; }
    .bar.cost-bar { background: var(--coral); opacity: .8; }
    .chart-label { color: #879189; font-size: 9px; margin-top: 7px; white-space: nowrap; }
    .chart-empty { height: 100%; display: grid; place-items: center; color: #9aa39c; font-size: 12px; }
    .content-grid { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(265px, .75fr); gap: 17px; align-items: start; }
    .content-grid > * { min-width: 0; }
    .list-panel, .category-panel { padding: 19px 20px; }
    .section-meta { color: var(--muted); font-size: 11px; }
    .table-wrap { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; min-width: 480px; text-align: left; }
    th { color: #8a948c; font-size: 10px; font-weight: 600; padding: 0 9px 11px; border-bottom: 1px solid var(--line); }
    td { padding: 12px 9px; border-bottom: 1px solid #eff2ef; font-size: 11px; vertical-align: middle; }
    tr:last-child td { border-bottom: 0; }
    .type-pill { display: inline-flex; border-radius: 4px; padding: 4px 7px; background: var(--green-soft); color: var(--green); font-size: 10px; }
    .type-pill.cost { color: #b35343; background: var(--coral-soft); }
    .amount { font-weight: 700; font-variant-numeric: tabular-nums; }
    .amount.income { color: var(--green); }
    .amount.expense { color: #bd5747; }
    .row-delete { border: 0; background: transparent; color: #a0aaa2; padding: 4px; font-size: 11px; }
    .row-delete:hover { color: #b34332; }
    .empty-row { text-align: center; color: #939c95; padding: 30px 10px; }
    .category-block + .category-block { border-top: 1px solid var(--line); margin-top: 15px; padding-top: 15px; }
    .category-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 9px; color: var(--muted); font-size: 10px; }
    .category-list { display: flex; flex-wrap: wrap; gap: 7px; }
    .category-chip { background: #f2f5f1; color: #45554a; border-radius: 5px; padding: 6px 9px; font-size: 10px; }
    .category-chip.cost-chip { background: #fff2ef; color: #a95143; }
    .add-category { background: transparent; border: 1px dashed #c9d5cb; color: var(--green); border-radius: 5px; padding: 5px 8px; font-size: 10px; }
    .privacy-note { color: #8e9990; font-size: 10px; line-height: 1.65; margin-top: 18px; }
    .overlay { position: fixed; inset: 0; background: rgba(18, 33, 24, .42); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
    .overlay.open { display: flex; }
    .dialog { background: #fff; border-radius: 10px; width: min(100%, 440px); padding: 22px; box-shadow: 0 22px 70px rgba(14,32,20,.23); animation: rise .2s ease-out; max-height: calc(100vh - 32px); overflow-y: auto; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .dialog-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
    .dialog h2 { font: 600 20px Georgia, serif; margin: 0; }
    .close { border: 0; background: transparent; color: #7d8980; font-size: 22px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
    .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .field.full { grid-column: 1 / -1; }
    .field label { color: #647168; font-size: 11px; }
    .field input, .field select { width: 100%; border: 1px solid #dfe6df; border-radius: 6px; padding: 10px; background: #fff; color: var(--ink); outline: none; font-size: 12px; }
    .field input:focus, .field select:focus { border-color: #70a184; box-shadow: 0 0 0 3px rgba(46,105,77,.1); }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 21px; }
    .sync-intro { color: #5d6b61; font-size: 12px; line-height: 1.7; margin: 0 0 13px; }
    .sync-steps { margin: 0 0 15px; padding-left: 18px; color: #5d6b61; font-size: 11px; line-height: 1.9; }
    .sync-steps code, .sync-meta code { background: #f2f5f1; border-radius: 4px; padding: 1px 5px; font-size: 10px; }
    .sync-steps a { color: var(--green); font-weight: 650; }
    .sync-form .field + .field { margin-top: 11px; }
    .sync-status-card { display: flex; align-items: center; gap: 8px; background: #f5f8f4; border: 1px solid var(--line); border-radius: 7px; padding: 12px; font-size: 12px; }
    .sync-status-card strong { font-size: 12px; }
    .sync-status-card .who { margin-left: auto; color: var(--muted); font-size: 10px; }
    .sync-detail { color: var(--muted); font-size: 10px; margin: 8px 0 0; }
    .sync-meta { color: var(--muted); font-size: 11px; margin: 12px 0 0; word-break: break-all; }
    .sync-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 8px; }
    .sync-actions .button { flex: 1 1 auto; }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 15px); opacity: 0; background: #203d2d; color: white; padding: 10px 15px; border-radius: 7px; font-size: 12px; transition: .2s; pointer-events: none; z-index: 20; }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }
    .mobile-brand { display: none; }
    @media (max-width: 1050px) {
      .app { grid-template-columns: 205px minmax(0, 1fr); }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .content-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 700px) {
      .app { display: block; padding-bottom: 68px; }
      .sidebar { display: none; }
      .main { padding: 19px 15px 28px; }
      .mobile-brand { display: flex; align-items: center; gap: 9px; margin-bottom: 21px; }
      .mobile-brand .brand-mark { width: 30px; height: 30px; font-size: 18px; }
      .mobile-brand .brand-name { font-size: 15px; }
      .topbar { display: block; margin-bottom: 18px; }
      .topbar h1 { font-size: 28px; }
      .top-actions { margin-top: 16px; }
      .top-actions .button { flex: 1; }
      .period-row { gap: 10px; padding: 12px 0 14px; }
      .segmented { width: 100%; }
      .segment { flex: 1; }
      .date-control { margin-left: 0; flex: 1; }
      .date-control input { width: 100%; min-width: 0; }
      .period-caption { width: 100%; }
      .stats { gap: 9px; margin-bottom: 12px; }
      .stat { min-height: 102px; padding: 13px 12px; }
      .stat-value { font-size: 21px; margin-top: 14px; }
      .stat-note { font-size: 9px; }
      .chart-panel { padding: 16px 13px 13px; margin-bottom: 12px; }
      .panel-heading { align-items: flex-start; }
      .panel-title { font-size: 15px; }
      .legend { gap: 9px; }
      .chart { height: 150px; }
      .bar-pair { height: 117px; }
      .list-panel, .category-panel { padding: 16px 13px; }
      .content-grid { gap: 12px; }
      .sync-actions .button { flex: 1 1 100%; }
      .bottom-nav { display: flex; position: fixed; z-index: 5; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,.96); border-top: 1px solid var(--line); padding: 8px 8px max(8px, env(safe-area-inset-bottom)); justify-content: space-around; backdrop-filter: blur(12px); }
      .bottom-nav button { flex: 1; background: transparent; border: 0; color: #748078; font-size: 10px; padding: 4px; }
      .bottom-nav button.active { color: var(--green); font-weight: 700; }
      .bottom-nav span { display: block; font-size: 17px; margin-bottom: 2px; }
      .toast { bottom: 78px; white-space: nowrap; }
    }
    @media (min-width: 701px) { .bottom-nav { display: none; } }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">日</div><div class="brand-name">日常经营台<span class="brand-sub">OFFLINE BUSINESS DESK</span></div></div>
      <div class="nav-label">经营管理</div>
      <button class="nav-item active" data-scroll="overview"><span class="nav-glyph">▦</span>经营概览</button>
      <button class="nav-item" data-scroll="records"><span class="nav-glyph">＋</span>收支记录</button>
      <button class="nav-item" data-scroll="categories"><span class="nav-glyph">◫</span>分类设置</button>
      <div class="side-bottom">
        <button class="side-sync" id="sideSyncBtn" type="button"><i class="sync-dot"></i><span id="sideSyncText">未开启云同步</span></button>
        <div class="side-note" id="sideSyncNote">数据同时保存在本机浏览器</div>
      </div>
    </aside>
    <main class="main" id="overview">
      <div class="mobile-brand"><div class="brand-mark">日</div><div class="brand-name">日常经营台</div></div>
      <header class="topbar">
        <div><div class="eyebrow">经营仪表盘</div><h1>把每天的账，理清楚。</h1><p class="subtitle">录入日常营收与成本，利润自动为你汇总。</p><button class="sync-chip" id="syncChip" type="button"><i class="sync-dot"></i><span id="syncChipText">开启云同步</span></button></div>
        <div class="top-actions">
          <button class="button" id="importBtn" title="从 JSON 备份恢复数据">恢复备份</button>
          <button class="button" id="exportBtn" title="导出数据备份">导出备份</button>
          <button class="button primary" id="addBtn">＋ 记一笔</button>
        </div>
      </header>
      <section class="period-row" aria-label="统计周期">
        <div class="segmented" role="tablist">
          <button class="segment active" data-period="day" role="tab" aria-selected="true">按天</button>
          <button class="segment" data-period="week" role="tab" aria-selected="false">按周</button>
          <button class="segment" data-period="month" role="tab" aria-selected="false">按月</button>
        </div>
        <div class="date-control"><button class="date-step" id="prevPeriod" aria-label="上一周期">‹</button><input id="focusDate" type="date" aria-label="选择统计日期"><button class="date-step" id="nextPeriod" aria-label="下一周期">›</button></div>
        <span class="period-caption" id="periodCaption"></span>
      </section>
      <section class="stats" aria-label="经营数据">
        <article class="stat revenue"><div class="stat-label"><i class="stat-dot"></i>总营收</div><div class="stat-value" id="revenueTotal">¥0.00</div><div class="stat-note" id="revenueNote">所选周期</div></article>
        <article class="stat cost"><div class="stat-label"><i class="stat-dot"></i>总成本</div><div class="stat-value" id="costTotal">¥0.00</div><div class="stat-note" id="costNote">所选周期</div></article>
        <article class="stat profit"><div class="stat-label"><i class="stat-dot"></i>经营利润</div><div class="stat-value" id="profitTotal">¥0.00</div><div class="stat-note">营收 − 成本</div></article>
        <article class="stat margin"><div class="stat-label"><i class="stat-dot"></i>利润率</div><div class="stat-value" id="marginTotal">0%</div><div class="stat-note">利润 ÷ 营收</div></article>
      </section>
      <section class="panel chart-panel">
        <div class="panel-heading"><h2 class="panel-title" id="chartTitle">收支走势</h2><div class="legend"><span><i></i>营收</span><span><i class="cost-key"></i>成本</span></div></div>
        <div class="chart" id="chart" aria-label="营收与成本柱状图"></div>
      </section>
      <div class="content-grid">
        <section class="panel list-panel" id="records">
          <div class="panel-heading"><h2 class="panel-title">收支明细</h2><span class="section-meta" id="recordCount">0 笔</span></div>
          <div class="table-wrap"><table><thead><tr><th>日期</th><th>类型</th><th>分类</th><th>备注</th><th>金额</th><th></th></tr></thead><tbody id="recordsBody"></tbody></table></div>
        </section>
        <section class="panel category-panel" id="categories">
          <div class="panel-heading"><h2 class="panel-title">收支分类</h2><span class="section-meta">可自定义</span></div>
          <div class="category-block"><div class="category-title"><span>营收小类</span><button class="add-category" data-add-category="income">＋ 添加</button></div><div class="category-list" id="incomeCategories"></div></div>
          <div class="category-block"><div class="category-title"><span>成本小类</span><button class="add-category" data-add-category="cost">＋ 添加</button></div><div class="category-list" id="costCategories"></div></div>
          <p class="privacy-note">数据保存在当前浏览器；开启云同步后会写入你自己的私有 Gist。更换设备或清理浏览器数据前，建议先导出一份备份。</p>
        </section>
      </div>
    </main>
  </div>
  <nav class="bottom-nav" aria-label="主要导航">
    <button class="active" data-scroll="overview"><span>▦</span>概览</button><button data-scroll="records"><span>＋</span>收支记录</button><button data-scroll="categories"><span>◫</span>分类</button><button data-sync-open><span>☁</span>同步</button>
  </nav>
  <div class="overlay" id="entryOverlay" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
    <form class="dialog" id="entryForm">
      <div class="dialog-head"><h2 id="dialogTitle">记一笔</h2><button class="close" type="button" data-close aria-label="关闭">×</button></div>
      <div class="form-grid">
        <div class="field"><label for="entryDate">日期</label><input id="entryDate" name="date" type="date" required></div>
        <div class="field"><label for="entryType">收支类型</label><select id="entryType" name="type"><option value="income">营收</option><option value="cost">成本</option></select></div>
        <div class="field"><label for="entryCategory">分类</label><select id="entryCategory" name="category" required></select></div>
        <div class="field"><label for="entryAmount">金额（元）</label><input id="entryAmount" name="amount" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="0.00" required></div>
        <div class="field full"><label for="entryNote">备注（选填）</label><input id="entryNote" name="note" maxlength="80" placeholder="例如：早市采购、堂食营业"></div>
      </div>
      <div class="dialog-actions"><button class="button" type="button" data-close>取消</button><button class="button primary" type="submit">保存记录</button></div>
    </form>
  </div>
  <div class="overlay" id="categoryOverlay" role="dialog" aria-modal="true" aria-labelledby="categoryDialogTitle">
    <form class="dialog" id="categoryForm"><div class="dialog-head"><h2 id="categoryDialogTitle">新增分类</h2><button class="close" type="button" data-close aria-label="关闭">×</button></div>
      <div class="field"><label for="categoryName">分类名称</label><input id="categoryName" maxlength="20" placeholder="输入分类名称" required></div>
      <div class="dialog-actions"><button class="button" type="button" data-close>取消</button><button class="button primary" type="submit">添加分类</button></div>
    </form>
  </div>
  <div class="overlay" id="syncOverlay" role="dialog" aria-modal="true" aria-labelledby="syncDialogTitle">
    <div class="dialog sync-dialog">
      <div class="dialog-head"><h2 id="syncDialogTitle">云端同步</h2><button class="close" type="button" data-close aria-label="关闭">×</button></div>
      <div id="syncBody"></div>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input id="importFile" type="file" accept="application/json,.json" hidden>
  <script>
    (() => {
      'use strict';

      const STORAGE_KEY = 'offline-business-desk-v1';
      const SYNC_TOKEN_KEY = 'obd-gist-token';
      const SYNC_GIST_KEY = 'obd-gist-id';
      const SYNC_USER_KEY = 'obd-gist-user';
      const SYNC_LAST_KEY = 'obd-gist-last-sync';
      const SYNC_PENDING_KEY = 'obd-restore-pending';
      const GIST_FILE = 'ledger.json';
      const GIST_DESC = '日常经营台 · 云端账本';
      const API = 'https://api.github.com';
      const DEFAULT_CATEGORIES = { income: ['商品销售', '其他收入'], cost: ['原料成本', '税务', '杂费'] };

      const $ = (selector) => document.querySelector(selector);
      const $$ = (selector) => [...document.querySelectorAll(selector)];
      const pad = (number) => String(number).padStart(2, '0');
      const dateKey = (date) => `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
      const money = (amount) => `¥${Number(amount || 0).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
      const escapeHTML = (value) => String(value).replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
      const clone = (value) => (typeof structuredClone === 'function' ? structuredClone(value) : JSON.parse(JSON.stringify(value)));
      const uid = () => (globalThis.crypto && typeof globalThis.crypto.randomUUID === 'function' ? globalThis.crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`);

      let state = loadState();
      let period = 'day';
      let selectedDate = new Date();
      let categoryType = 'income';
      let syncToken = localStorage.getItem(SYNC_TOKEN_KEY) || '';
      let syncGistId = localStorage.getItem(SYNC_GIST_KEY) || '';
      let syncUser = localStorage.getItem(SYNC_USER_KEY) || '';
      let lastSyncAt = Number(localStorage.getItem(SYNC_LAST_KEY)) || 0;
      let restorePending = localStorage.getItem(SYNC_PENDING_KEY) === '1';
      let syncBusy = false;
      let syncQueued = false;
      let syncPending = false;
      let syncError = '';
      let syncTimer = 0;

      function loadState() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (saved && typeof saved === 'object' && (Array.isArray(saved.entries) || saved.categories)) {
            return normalizeLedger(saved);
          }
        } catch { /* Start with an empty ledger when stored data is unreadable. */ }
        return normalizeLedger({ categories: DEFAULT_CATEGORIES, entries: [] });
      }

      function normalizeLedger(raw) {
        const time = Date.now();
        const cleanCategories = (value) => {
          if (!Array.isArray(value)) return [];
          const names = value
            .map((name) => String(name || '').trim())
            .filter((name) => name && name.length <= 20);
          return [...new Set(names)].slice(0, 100);
        };
        const categories = {
          income: cleanCategories(raw && raw.categories ? raw.categories.income : []),
          cost: cleanCategories(raw && raw.categories ? raw.categories.cost : [])
        };
        const entries = [];
        const seen = new Set();
        const list = raw && Array.isArray(raw.entries) ? raw.entries.slice(0, 50000) : [];
        for (const item of list) {
          if (!item || typeof item !== 'object') continue;
          const date = String(item.date || '');
          const type = item.type === 'cost' ? 'cost' : item.type === 'income' ? 'income' : '';
          const amount = Math.round(Number(item.amount) * 100) / 100;
          const category = String(item.category || '').trim();
          if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || !type || !Number.isFinite(amount) || amount <= 0 || !category || category.length > 20) continue;
          let id = String(item.id || '');
          if (!id || seen.has(id)) id = uid();
          seen.add(id);
          const createdAt = Number(item.createdAt) || time;
          entries.push({
            id,
            date,
            type,
            category,
            amount,
            note: String(item.note || '').slice(0, 80),
            createdAt,
            updatedAt: Number(item.updatedAt) || createdAt,
            deleted: item.deleted === true
          });
        }
        return { version: 2, categories, entries };
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch {
          showToast('本地存储空间不足，请先导出备份');
        }
      }

      function activeEntries() {
        return state.entries.filter((entry) => !entry.deleted);
      }

      function periodRange() {
        const start = new Date(selectedDate.getFullYear(), selectedDate.getMonth(), selectedDate.getDate());
        let end = new Date(start);
        if (period === 'week') {
          start.setDate(start.getDate() - ((start.getDay() + 6) % 7));
          end = new Date(start); end.setDate(start.getDate() + 6);
        } else if (period === 'month') {
          start.setDate(1); end = new Date(start.getFullYear(), start.getMonth() + 1, 0);
        }
        return { start, end };
      }

      function entriesInRange() {
        const { start, end } = periodRange();
        const from = dateKey(start), to = dateKey(end);
        return activeEntries().filter((entry) => entry.date >= from && entry.date <= to);
      }

      function render() {
        const { start, end } = periodRange();
        $('#focusDate').value = dateKey(selectedDate);
        $('#periodCaption').textContent = period === 'day' ? dateKey(start) : `${dateKey(start)} 至 ${dateKey(end)}`;
        $('#chartTitle').textContent = period === 'day' ? '当日收支构成' : period === 'week' ? '本周收支走势' : '本月收支走势';
        const entries = entriesInRange();
        const income = entries.filter((entry) => entry.type === 'income').reduce((sum, entry) => sum + Number(entry.amount), 0);
        const cost = entries.filter((entry) => entry.type === 'cost').reduce((sum, entry) => sum + Number(entry.amount), 0);
        const profit = income - cost;
        $('#revenueTotal').textContent = money(income);
        $('#costTotal').textContent = money(cost);
        $('#profitTotal').textContent = money(profit);
        $('#profitTotal').style.color = profit < 0 ? '#bd5747' : '';
        $('#marginTotal').textContent = income ? `${(profit / income * 100).toFixed(1)}%` : '0%';
        const periodName = period === 'day' ? '当日' : period === 'week' ? '本周' : '本月';
        $('#revenueNote').textContent = `${periodName} · ${entries.filter((entry) => entry.type === 'income').length} 笔`;
        $('#costNote').textContent = `${periodName} · ${entries.filter((entry) => entry.type === 'cost').length} 笔`;
        renderChart(entries, start, end);
        renderEntries(entries);
        renderCategories();
        updateCategoryOptions();
        updateSyncUI();
      }

      function renderChart(entries, start, end) {
        const chart = $('#chart');
        const days = [];
        if (period === 'day') days.push(new Date(start));
        else {
          const count = period === 'week' ? 7 : end.getDate();
          for (let i = 0; i < count; i++) days.push(new Date(start.getFullYear(), start.getMonth(), start.getDate() + i));
        }
        const totals = days.map((date) => {
          const key = dateKey(date);
          const matching = entries.filter((entry) => entry.date === key);
          return {
            date,
            income: matching.filter((entry) => entry.type === 'income').reduce((sum, entry) => sum + Number(entry.amount), 0),
            cost: matching.filter((entry) => entry.type === 'cost').reduce((sum, entry) => sum + Number(entry.amount), 0)
          };
        });
        const max = Math.max(1, ...totals.flatMap((item) => [item.income, item.cost]));
        if (!entries.length) { chart.innerHTML = '<div class="chart-empty">记录几笔收支后，这里会显示趋势</div>'; return; }
        chart.innerHTML = totals.map((item) => {
          const incomeHeight = item.income ? Math.max(3, item.income / max * 100) : 0;
          const costHeight = item.cost ? Math.max(3, item.cost / max * 100) : 0;
          const label = period === 'day' ? '当日' : `${item.date.getMonth() + 1}/${item.date.getDate()}`;
          return `<div class="chart-group" title="${dateKey(item.date)} 营收 ${money(item.income)}，成本 ${money(item.cost)}"><div class="bar-pair"><i class="bar" style="height:${incomeHeight}%"></i><i class="bar cost-bar" style="height:${costHeight}%"></i></div><span class="chart-label">${label}</span></div>`;
        }).join('');
      }

      function renderEntries(entries) {
        const sorted = [...entries].sort((a, b) => b.date.localeCompare(a.date) || b.createdAt - a.createdAt);
        $('#recordCount').textContent = `${sorted.length} 笔`;
        $('#recordsBody').innerHTML = sorted.length ? sorted.map((entry) => `<tr><td>${escapeHTML(entry.date)}</td><td><span class="type-pill ${entry.type === 'cost' ? 'cost' : ''}">${entry.type === 'income' ? '营收' : '成本'}</span></td><td>${escapeHTML(entry.category)}</td><td>${escapeHTML(entry.note || '—')}</td><td class="amount ${entry.type === 'income' ? 'income' : 'expense'}">${entry.type === 'income' ? '+' : '−'}${money(entry.amount)}</td><td><button class="row-delete" data-delete="${escapeHTML(entry.id)}" aria-label="删除记录">删除</button></td></tr>`).join('') : '<tr><td colspan="6" class="empty-row">该周期还没有记录，点击「记一笔」开始</td></tr>';
      }

      function renderCategories() {
        $('#incomeCategories').innerHTML = state.categories.income.map((name) => `<span class="category-chip">${escapeHTML(name)}</span>`).join('');
        $('#costCategories').innerHTML = state.categories.cost.map((name) => `<span class="category-chip cost-chip">${escapeHTML(name)}</span>`).join('');
      }

      function updateCategoryOptions() {
        const type = $('#entryType').value;
        const options = state.categories[type] || [];
        $('#entryCategory').innerHTML = options.map((name) => `<option value="${escapeHTML(name)}">${escapeHTML(name)}</option>`).join('');
      }

      function showToast(message) {
        const toast = $('#toast'); toast.textContent = message; toast.classList.add('show');
        clearTimeout(showToast.timer); showToast.timer = setTimeout(() => toast.classList.remove('show'), 2200);
      }

      function openDialog(id) { $(id).classList.add('open'); }
      function closeDialogs() { $$('.overlay').forEach((overlay) => overlay.classList.remove('open')); }

      /* ---------- 云端同步（GitHub 私有 Gist） ---------- */

      function sameSet(a, b) {
        if (a.length !== b.length) return false;
        const set = new Set(b);
        return a.every((name) => set.has(name));
      }

      function categoriesAreDefault(categories) {
        return sameSet(categories.income, DEFAULT_CATEGORIES.income) && sameSet(categories.cost, DEFAULT_CATEGORIES.cost);
      }

      function pickNewer(a, b) {
        if (a.updatedAt !== b.updatedAt) return a.updatedAt > b.updatedAt ? a : b;
        const aText = JSON.stringify(a), bText = JSON.stringify(b);
        return aText >= bText ? a : b;
      }

      function mergeLedgers(local, remote) {
        const byId = new Map();
        for (const entry of [...local.entries, ...remote.entries]) {
          const existing = byId.get(entry.id);
          byId.set(entry.id, existing ? pickNewer(existing, entry) : { ...entry });
        }
        return {
          version: 2,
          categories: {
            income: [...new Set([...local.categories.income, ...remote.categories.income])],
            cost: [...new Set([...local.categories.cost, ...remote.categories.cost])]
          },
          entries: [...byId.values()]
        };
      }

      function canonical(ledger) {
        return JSON.stringify({
          income: [...ledger.categories.income].sort(),
          cost: [...ledger.categories.cost].sort(),
          entries: [...ledger.entries]
            .map((entry) => ({
              id: entry.id,
              date: entry.date,
              type: entry.type,
              category: entry.category,
              amount: entry.amount,
              note: entry.note,
              createdAt: entry.createdAt,
              updatedAt: entry.updatedAt,
              deleted: entry.deleted === true
            }))
            .sort((a, b) => a.id.localeCompare(b.id))
        });
      }

      async function github(path, options = {}) {
        const headers = {
          Accept: 'application/vnd.github+json',
          Authorization: `Bearer ${syncToken}`,
          'X-GitHub-Api-Version': '2022-11-28'
        };
        if (options.body) headers['Content-Type'] = 'application/json';
        let response;
        try {
          response = await fetch(`${API}${path}`, { ...options, headers: { ...headers, ...(options.headers || {}) } });
        } catch {
          throw new Error('网络连接失败');
        }
        if (!response.ok) {
          const known = {
            401: '令牌无效或已过期',
            403: 'GitHub 拒绝访问，请检查令牌权限',
            404: '找不到 Gist 或令牌无权限',
            422: '提交的数据被 GitHub 拒绝',
            429: '请求过于频繁，请稍后再试'
          };
          throw new Error(known[response.status] || `GitHub 返回 ${response.status}`);
        }
        if (response.status === 204) return null;
        return response.json();
      }

      async function fetchRemoteLedger() {
        const gist = await github(`/gists/${encodeURIComponent(syncGistId)}`, { cache: 'no-store' });
        const files = (gist && gist.files) || {};
        const file = files[GIST_FILE] || Object.values(files)[0];
        if (!file) return null;
        let content = file.content;
        if (file.truncated && file.raw_url) {
          const response = await fetch(file.raw_url, { cache: 'no-store' });
          if (!response.ok) throw new Error('云端账本读取失败');
          content = await response.text();
        }
        if (!content) return null;
        let parsed;
        try { parsed = JSON.parse(content); } catch { throw new Error('云端账本格式异常'); }
        return normalizeLedger(parsed);
      }

      async function findGist() {
        for (let page = 1; page <= 3; page++) {
          const gists = await github(`/gists?per_page=100&page=${page}`, { cache: 'no-store' });
          if (!Array.isArray(gists) || !gists.length) break;
          const match = gists.find((gist) => gist.description === GIST_DESC && gist.files && gist.files[GIST_FILE]);
          if (match) return match.id;
          if (gists.length < 100) break;
        }
        return '';
      }

      async function createGist() {
        const gist = await github('/gists', {
          method: 'POST',
          body: JSON.stringify({
            description: GIST_DESC,
            public: false,
            files: { [GIST_FILE]: { content: JSON.stringify(state, null, 2) } }
          })
        });
        if (!gist || !gist.id) throw new Error('创建 Gist 失败');
        return gist.id;
      }

      async function connectSync(token, manualGistId) {
        const clean = String(token || '').trim();
        if (!clean) throw new Error('请先填写 GitHub 令牌');
        syncToken = clean;
        const user = await github('/user');
        syncUser = user && user.login ? user.login : '';
        let gistId = String(manualGistId || '').trim();
        if (gistId) {
          const existing = await github(`/gists/${encodeURIComponent(gistId)}`, { cache: 'no-store' });
          if (!existing || !existing.files || !existing.files[GIST_FILE]) throw new Error('该 Gist 里没有 ledger.json');
        } else {
          gistId = await findGist();
          if (!gistId) gistId = await createGist();
        }
        syncGistId = gistId;
        localStorage.setItem(SYNC_TOKEN_KEY, syncToken);
        localStorage.setItem(SYNC_GIST_KEY, syncGistId);
        localStorage.setItem(SYNC_USER_KEY, syncUser);
        await syncNow('connect');
      }

      function syncStatus() {
        if (!syncToken || !syncGistId) return { dot: '', short: '未开启云同步' };
        if (syncBusy) return { dot: 'busy', short: '同步中…' };
        if (syncError) return { dot: 'err', short: '同步失败，点击重试' };
        if (syncPending) return { dot: 'busy', short: '有更改待同步' };
        if (lastSyncAt) {
          const time = new Date(lastSyncAt).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
          return { dot: 'ok', short: `已同步 ${time}` };
        }
        return { dot: '', short: '等待首次同步' };
      }

      function updateSyncUI() {
        const status = syncStatus();
        const chipText = $('#syncChipText');
        if (chipText) chipText.textContent = syncToken && syncGistId ? status.short : '开启云同步';
        const chipDot = $('#syncChip .sync-dot');
        if (chipDot) chipDot.className = `sync-dot ${status.dot}`;
        const sideText = $('#sideSyncText');
        if (sideText) sideText.textContent = status.short;
        const sideDot = $('#sideSyncBtn .sync-dot');
        if (sideDot) sideDot.className = `sync-dot ${status.dot}`;
        const note = $('#sideSyncNote');
        if (note) {
          if (!syncToken || !syncGistId) note.textContent = '数据同时保存在本机浏览器';
          else if (syncError) note.textContent = `上次同步失败`;
          else if (lastSyncAt) note.textContent = `最后同步 ${new Date(lastSyncAt).toLocaleString('zh-CN')}`;
          else note.textContent = '已配置云端同步';
        }
        const dialogText = $('#syncStateText');
        if (dialogText) {
          dialogText.textContent = syncError || status.short;
          const dialogDot = $('#syncStateDot');
          if (dialogDot) dialogDot.className = `sync-dot ${status.dot}`;
          const detail = $('#syncDetail');
          if (detail) detail.textContent = syncError ? `错误：${syncError}` : lastSyncAt ? `上次同步：${new Date(lastSyncAt).toLocaleString('zh-CN')}` : '尚未同步';
        }
      }

      function renderSyncDialog() {
        const body = $('#syncBody');
        if (!syncToken || !syncGistId) {
          body.innerHTML = `
            <p class="sync-intro">用你 GitHub 账号里的一个私有 Gist 保存账本。电脑和手机粘贴同一个令牌后，数据会自动双向同步。</p>
            <ol class="sync-steps">
              <li>打开 <a href="https://github.com/settings/tokens/new?scopes=gist&amp;description=business-desk-sync" target="_blank" rel="noopener">GitHub 令牌创建页</a>，只勾选 <code>gist</code> 权限。</li>
              <li>设置有效期并生成，复制 <code>ghp_</code> 开头的令牌。</li>
              <li>粘贴到下面，点“连接并同步”。第一台设备会自动新建私有 Gist，其他设备会自动找到它。</li>
            </ol>
            <form id="syncForm" class="sync-form">
              <div class="field"><label for="syncTokenInput">GitHub 令牌</label><input id="syncTokenInput" type="password" autocomplete="off" spellcheck="false" placeholder="ghp_..." required></div>
              <div class="field"><label for="syncGistInput">已有 Gist ID（选填）</label><input id="syncGistInput" autocomplete="off" spellcheck="false" placeholder="留空会自动查找或新建"></div>
              <div class="dialog-actions"><button class="button" type="button" data-close>取消</button><button class="button primary" type="submit" id="syncConnectBtn">连接并同步</button></div>
            </form>
            <p class="privacy-note">令牌只保存在当前浏览器，除 GitHub 外不会发给任何服务器。建议每台设备单独建一个令牌，不用了随时在 GitHub 吊销。</p>`;
          $('#syncForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const button = $('#syncConnectBtn');
            button.disabled = true;
            button.textContent = '连接中…';
            try {
              await connectSync($('#syncTokenInput').value, $('#syncGistInput').value);
              renderSyncDialog();
            } catch (error) {
              showToast(`连接失败：${error.message}`);
              button.disabled = false;
              button.textContent = '连接并同步';
            }
          });
          return;
        }
        const status = syncStatus();
        body.innerHTML = `
          <div class="sync-status-card"><i class="sync-dot ${status.dot}" id="syncStateDot"></i><strong id="syncStateText">${escapeHTML(syncError || status.short)}</strong><span class="who">${syncUser ? '@' + escapeHTML(syncUser) : ''}</span></div>
          <p class="sync-detail" id="syncDetail"></p>
          <p class="sync-meta">Gist ID：<code>${escapeHTML(syncGistId)}</code></p>
          <div class="sync-actions">
            <button class="button primary" type="button" id="syncNowBtn">立即同步</button>
            <button class="button" type="button" id="copyGistBtn">复制 Gist ID</button>
            <button class="button danger" type="button" id="disconnectBtn">断开同步</button>
          </div>
          <p class="privacy-note">数据存在你的私有 Gist 里，令牌只保存在本机浏览器。断开同步只影响本机，不会删除云端数据。</p>`;
        $('#syncNowBtn').addEventListener('click', () => syncNow('manual'));
        $('#copyGistBtn').addEventListener('click', copyGistId);
        $('#disconnectBtn').addEventListener('click', disconnectSync);
        updateSyncUI();
      }

      function openSyncDialog() {
        renderSyncDialog();
        openDialog('#syncOverlay');
      }

      async function copyGistId() {
        try {
          await navigator.clipboard.writeText(syncGistId);
          showToast('Gist ID 已复制');
        } catch {
          showToast(`Gist ID：${syncGistId}`);
        }
      }

      function disconnectSync() {
        if (!confirm('断开后本机停止同步，云端数据不会被删除。确定断开吗？')) return;
        syncToken = '';
        syncGistId = '';
        syncUser = '';
        lastSyncAt = 0;
        syncError = '';
        syncPending = false;
        restorePending = false;
        localStorage.removeItem(SYNC_TOKEN_KEY);
        localStorage.removeItem(SYNC_GIST_KEY);
        localStorage.removeItem(SYNC_USER_KEY);
        localStorage.removeItem(SYNC_LAST_KEY);
        localStorage.removeItem(SYNC_PENDING_KEY);
        updateSyncUI();
        renderSyncDialog();
        showToast('已断开云端同步');
      }

      function scheduleSync() {
        if (!syncToken || !syncGistId) return;
        syncPending = true;
        updateSyncUI();
        clearTimeout(syncTimer);
        syncTimer = setTimeout(() => syncNow('auto'), 1200);
      }

      async function syncNow(trigger = 'auto') {
        if (!syncToken || !syncGistId) {
          if (trigger === 'manual') openSyncDialog();
          return false;
        }
        if (syncBusy) { syncQueued = true; return false; }
        syncBusy = true;
        syncError = '';
        syncPending = false;
        updateSyncUI();
        try {
          const remote = await fetchRemoteLedger();
          let working = state;
          let didRestore = false;
          if (remote) {
            if (restorePending) {
              const stamp = Date.now();
              const restoredIds = new Set(working.entries.map((entry) => entry.id));
              const tombstones = remote.entries
                .filter((entry) => !restoredIds.has(entry.id))
                .map((entry) => ({ ...entry, deleted: true, updatedAt: stamp }));
              working = mergeLedgers(working, { version: 2, categories: remote.categories, entries: tombstones });
              working.entries = working.entries.map((entry) => restoredIds.has(entry.id) ? { ...entry, updatedAt: stamp } : entry);
              didRestore = true;
            } else {
              if (!working.entries.length && categoriesAreDefault(working.categories)) {
                working = { ...working, categories: remote.categories };
              }
              working = mergeLedgers(working, remote);
            }
          }
          state = working;
          saveState();
          render();
          const changed = !remote || canonical(state) !== canonical(remote);
          if (changed) {
            await github(`/gists/${encodeURIComponent(syncGistId)}`, {
              method: 'PATCH',
              body: JSON.stringify({ files: { [GIST_FILE]: { content: JSON.stringify(state, null, 2) } } })
            });
          }
          if (didRestore) {
            restorePending = false;
            localStorage.removeItem(SYNC_PENDING_KEY);
          }
          lastSyncAt = Date.now();
          localStorage.setItem(SYNC_LAST_KEY, String(lastSyncAt));
          updateSyncUI();
          if (trigger === 'connect') showToast('云端同步已开启');
          if (trigger === 'restore') showToast('备份已同步到云端');
          if (trigger === 'manual') showToast('已与云端同步');
          return true;
        } catch (error) {
          syncError = error.message || '同步失败';
          updateSyncUI();
          if (!['auto', 'poll', 'focus', 'online', 'queued', 'load'].includes(trigger)) showToast(`同步失败：${syncError}`);
          return false;
        } finally {
          syncBusy = false;
          updateSyncUI();
          if (syncQueued) {
            syncQueued = false;
            setTimeout(() => syncNow('queued'), 600);
          }
        }
      }

      /* ---------- 交互事件 ---------- */

      $('#addBtn').addEventListener('click', () => {
        $('#entryDate').value = dateKey(selectedDate);
        $('#entryForm').reset(); $('#entryDate').value = dateKey(selectedDate); updateCategoryOptions();
        openDialog('#entryOverlay'); $('#entryType').focus();
      });
      $('#entryType').addEventListener('change', updateCategoryOptions);
      $('#entryForm').addEventListener('submit', (event) => {
        event.preventDefault();
        const form = new FormData(event.currentTarget);
        const amount = Math.round(Number(form.get('amount')) * 100) / 100;
        if (!Number.isFinite(amount) || amount <= 0) { showToast('请输入大于 0 的有效金额'); return; }
        const stamp = Date.now();
        state.entries.push({ id: uid(), date: form.get('date'), type: form.get('type'), category: form.get('category'), amount, note: String(form.get('note') || '').trim(), createdAt: stamp, updatedAt: stamp, deleted: false });
        saveState(); closeDialogs(); render(); scheduleSync(); showToast('收支记录已保存');
      });
      $('#recordsBody').addEventListener('click', (event) => {
        const button = event.target.closest('[data-delete]'); if (!button) return;
        const entry = state.entries.find((item) => item.id === button.dataset.delete);
        if (!entry || !confirm(`确定删除「${entry.category}」${money(entry.amount)} 这笔记录吗？`)) return;
        entry.deleted = true;
        entry.updatedAt = Date.now();
        saveState(); render(); scheduleSync(); showToast('记录已删除');
      });
      $$('.segment').forEach((button) => button.addEventListener('click', () => {
        period = button.dataset.period;
        $$('.segment').forEach((item) => { item.classList.toggle('active', item === button); item.setAttribute('aria-selected', String(item === button)); });
        render();
      }));
      $('#focusDate').addEventListener('change', (event) => { if (!event.target.value) return; selectedDate = new Date(`${event.target.value}T12:00:00`); render(); });
      function shiftPeriod(direction) {
        if (period === 'day') selectedDate.setDate(selectedDate.getDate() + direction);
        else if (period === 'week') selectedDate.setDate(selectedDate.getDate() + direction * 7);
        else { selectedDate.setDate(1); selectedDate.setMonth(selectedDate.getMonth() + direction); }
        render();
      }
      $('#prevPeriod').addEventListener('click', () => shiftPeriod(-1));
      $('#nextPeriod').addEventListener('click', () => shiftPeriod(1));
      $$('.add-category').forEach((button) => button.addEventListener('click', () => {
        categoryType = button.dataset.addCategory; $('#categoryForm').reset(); openDialog('#categoryOverlay'); $('#categoryName').focus();
      }));
      $('#categoryForm').addEventListener('submit', (event) => {
        event.preventDefault();
        const name = $('#categoryName').value.trim();
        if (!name) return;
        if (state.categories[categoryType].includes(name)) { showToast('这个分类已经存在'); return; }
        state.categories[categoryType].push(name); saveState(); closeDialogs(); render(); scheduleSync(); showToast('分类已添加');
      });
      $('#importBtn').addEventListener('click', () => $('#importFile').click());
      $('#importFile').addEventListener('change', async (event) => {
        const file = event.target.files[0];
        if (!file) return;
        try {
          const backup = JSON.parse(await file.text());
          if (!backup || typeof backup !== 'object' || (!Array.isArray(backup.entries) && !backup.categories)) throw new Error('invalid backup');
          const restored = normalizeLedger(backup);
          if (!restored.categories.income.length && !restored.categories.cost.length) restored.categories = clone(state.categories);
          const activeCount = restored.entries.filter((entry) => !entry.deleted).length;
          const cloudNote = syncToken && syncGistId ? '，并用这份备份覆盖云端数据' : '';
          if (!confirm(`备份包含 ${activeCount} 笔有效记录。导入后将替换当前本机数据${cloudNote}，是否继续？`)) return;
          const stamp = Date.now();
          restored.entries = restored.entries.map((entry) => ({ ...entry, updatedAt: stamp }));
          state = restored;
          restorePending = true;
          localStorage.setItem(SYNC_PENDING_KEY, '1');
          saveState(); render();
          if (syncToken && syncGistId) { syncNow('restore'); showToast('备份已导入，正在同步到云端'); }
          else showToast('备份数据已恢复');
        } catch { showToast('备份文件无效，未修改现有数据'); }
        finally { event.target.value = ''; }
      });
      $('#exportBtn').addEventListener('click', () => {
        const payload = { version: 2, exportedAt: new Date().toISOString(), categories: state.categories, entries: state.entries };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob); const link = document.createElement('a'); link.href = url; link.download = `经营数据备份-${dateKey(new Date())}.json`; link.click(); URL.revokeObjectURL(url); showToast('备份文件已导出');
      });
      $$('.nav-item, .bottom-nav button[data-scroll]').forEach((button) => button.addEventListener('click', () => {
        const target = document.getElementById(button.dataset.scroll);
        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        $$('.nav-item, .bottom-nav button[data-scroll]').forEach((item) => item.classList.toggle('active', item.dataset.scroll === button.dataset.scroll));
      }));
      $$('[data-sync-open]').forEach((button) => button.addEventListener('click', openSyncDialog));
      $('#syncChip').addEventListener('click', openSyncDialog);
      $('#sideSyncBtn').addEventListener('click', openSyncDialog);
      document.addEventListener('click', (event) => {
        const closer = event.target.closest('[data-close]');
        if (closer) closeDialogs();
      });
      $$('.overlay').forEach((overlay) => overlay.addEventListener('click', (event) => { if (event.target === overlay) closeDialogs(); }));
      document.addEventListener('keydown', (event) => { if (event.key === 'Escape') closeDialogs(); });

      render();
      if (syncToken && syncGistId) setTimeout(() => syncNow('load'), 400);
      setInterval(() => {
        if (document.visibilityState === 'visible' && syncToken && syncGistId && !syncBusy) syncNow('poll');
      }, 90000);
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && syncToken && syncGistId) syncNow('focus');
      });
      window.addEventListener('online', () => { if (syncToken && syncGistId) syncNow('online'); });
      window.addEventListener('focus', () => { if (syncToken && syncGistId) syncNow('focus'); });
    })();
  </script>
</body>
</html>
